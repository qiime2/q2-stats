about:
  home: https://qiime2.org
  license: BSD-3-Clause
  license_family: BSD
build:
  script: make install
package:
  name: q2-stats
  version: {{ PLUGIN_VERSION }}
requirements:
  build:
  - nodejs
  - setuptools
  - versioningit
  host:
  - python {{ python }}
  - setuptools
  - versioningit
  - wheel
  run:
  - python {{ python }}
  - pandas {{ pandas }}
  - scipy {{ scipy }}
  - jinja2
  - frictionless<=5.5.0
  - statsmodels
  - qiime2 {{ qiime2_epoch }}.*
  - q2-types {{ qiime2_epoch }}.*
source:
  path: ..
test:
  commands:
  - py.test --pyargs q2_stats
  imports:
  - q2_stats
  - qiime2.plugins.stats
  requires:
  - qiime2 >={{ qiime2 }}
  - q2-types >={{ q2_types }}
  - pytest
